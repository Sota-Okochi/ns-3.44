# DQN training configuration
# Multi-DQN keeps the UE-wise 9-feature Q network and extends candidate/action handling.

algorithm: dqn
implementation_plan: candidate_wise_multi_dqn

seed: 1
num_episodes: 50
num_steps_per_episode: 5

# DQN hyperparameters: initial placeholders for small-scale verification.
gamma: 0.95
learning_rate: 0.0001
batch_size: 32
replay_buffer_size: 10000
train_start_size: 200

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 1000

target_update_interval: 50
hidden_dims: [128, 128]

save_interval_episodes: 10

multi_dqn:
  enabled: true
  max_switches: 8
  max_switches_ratio: 0.10
  candidate_mode: top_k_low
  satisfaction_threshold: 0.5
  min_advantage: 0.0
  exclude_current_bs_action: true
  ranking_metric: advantage
  sequential_inference: true
