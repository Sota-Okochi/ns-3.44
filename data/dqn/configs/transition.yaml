# Transition dataset schema for DQN training.
# One row corresponds to one transition: (s_t, a_t, r_t, s_{t+1}, done).
# Redundant columns such as harmonic_mean_before and harmonic_mean_after
# are intentionally omitted.

transition:
  id_columns:
    - seed
    - cycle_id
    - target_ue_id

  state_columns:
    - cycle_id
    - current_bs_id
    - app_type
    - tp_mbps
    - rtt_ms
    - satisfaction
    - num_users_on_current_bs
    - harmonic_mean
    - num_unsatisfied_users

  action_columns:
    - action_selected_bs_id

  reward_columns:
    - reward

  next_state_columns:
    - next_cycle_id
    - next_current_bs_id
    - next_app_type
    - next_tp_mbps
    - next_rtt_ms
    - next_satisfaction
    - next_num_users_on_current_bs
    - next_harmonic_mean
    - next_num_unsatisfied_users

  terminal_columns:
    - done
